name: Offline Android tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow KVM in the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 768M
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: sh ./gradlew connectedDebugAndroidTest; result=$?; mkdir -p app/build/screenshots; adb pull /sdcard/Download/shakalizator-home.png app/build/screenshots/ || true; exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Offline-Android-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/screenshots/
